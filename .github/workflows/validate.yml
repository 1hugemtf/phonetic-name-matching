name: Validate notebook
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Execute notebook and verify results
        run: python validate_notebook.py
      - name: Save executed notebook and chart
        uses: actions/upload-artifact@v7
        with:
          name: executed-name-analysis
          path: |
            notebook.ipynb
            matching_coverage.png
